name: 인스타 현장 조사 (주간)

# 해시태그 계층·후킹 패턴·저장 유도 비율을 매주 직접 긁어와 data/trends.json 을 갱신한다.
# 생성기가 이 파일을 읽으므로, 사람이 brand-config 를 손으로 고치지 않아도 카피가 현장에 맞춰 따라간다.
on:
  schedule:
    - cron: "0 20 * * 0" # 매주 월요일 KST 05시
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: research-trends
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: 해시태그 상위 게시물 조사
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run research

      - name: 조사 결과 커밋
        if: always()
        run: |
          git config user.name "card-news-bot"
          git config user.email "card-news-bot@users.noreply.github.com"
          git add data/trends.json
          git diff --staged --quiet || git commit -m "chore: 인스타 현장 조사 결과 갱신"
          git push origin HEAD:${GITHUB_REF_NAME}
