name: 자동 검수 테스트

# 검수 규칙(src/quality/checklist.js)이나 렌더러를 건드리는 변경이 들어오면
# PR 단계에서 바로 잡기 위한 워크플로. API 키 없이 도는 검사만 실행한다.
on:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 자체 점검 (정상 원고 통과 + 위반 차단)
        run: npm test

      - name: 샘플 렌더 (전략 → 검수 → 카드 10장)
        run: npm run check

      - name: 렌더된 카드 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-cards
          path: out/sample/
          retention-days: 7
