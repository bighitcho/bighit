name: 댓글 키워드 자동 DM (1시간마다)

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # 중복 실행으로 같은 댓글에 두 번 보내지 않도록 한 번에 하나만 돌린다.
  group: comment-to-dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: 댓글 확인 및 DM 발송
        env:
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          COMMENT_DM_ENABLED: ${{ vars.COMMENT_DM_ENABLED || 'false' }}
        run: npm run comment-dm

      - name: 발송 기록 커밋
        if: always()
        run: |
          git config user.name "card-news-bot"
          git config user.email "card-news-bot@users.noreply.github.com"
          git add data/dm-log.json
          git diff --staged --quiet || git commit -m "chore: 자동 DM 발송 기록 업데이트"
          git push origin HEAD:${GITHUB_REF_NAME}
