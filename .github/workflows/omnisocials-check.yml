name: OmniSocials connection check
on:
  push:
    branches: [codex/youtube-drive-automation]
    paths:
      - youtube/omnisocials_check.py
      - .github/workflows/omnisocials-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check connected account counts (no publishing)
        env:
          OMNISOCIALS_API_KEY: ${{ secrets.OMNISOCIALS_API_KEY }}
        run: python3 youtube/omnisocials_check.py
