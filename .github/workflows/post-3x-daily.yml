name: 카드뉴스 하루 3회 자동 게시

on:
  schedule:
    # 한국시간(KST) 기준 08:00 / 13:00 / 20:00 = UTC 23:00(전날) / 04:00 / 11:00
    - cron: "0 23,4,11 * * *"
  workflow_dispatch: {} # 수동 실행 버튼으로도 테스트 가능

permissions:
  contents: write

concurrency:
  # 스케줄과 수동 실행이 겹쳐 같은 시간에 두 번 게시되는 것을 막는다.
  group: card-news-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 카드뉴스 생성 및 게시
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
          # 위치 태그(선택) — 장소 페이지 ID를 넣으면 지역 도달이 붙는다
          IG_LOCATION_ID: ${{ vars.IG_LOCATION_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          CARD_THEME: ${{ vars.CARD_THEME || 'gray' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          # 큐가 비었을 때 인스타 벤치마크 계정에서 소재를 발굴한다(없으면 구글 뉴스로 넘어감)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 발행 직후 표지 카드를 스토리에도 리포스트해 초기 도달을 만든다
          POST_STORY: ${{ vars.POST_STORY || 'false' }}
        run: npm run run-once

      - name: 생성된 이미지 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-news-output
          path: out/
          retention-days: 7
